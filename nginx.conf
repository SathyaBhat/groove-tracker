server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The page and service worker must always be revalidated so a deploy is seen at once.
  # Hashed files under /assets/ change name with every build, so they can be cached as usual.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }

  location / { try_files $uri $uri/ /index.html; }
}
