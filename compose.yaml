name: groove-tracker

x-app-environment: &app-environment
  DATABASE_URL: postgresql://groove:${POSTGRES_PASSWORD:-groove}@db:5432/groove_tracker
  DATABASE_SSL: "false"
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
  API_ORIGIN: ${API_ORIGIN:-http://localhost:3001}
  DISCOGS_CONSUMER_KEY: ${DISCOGS_CONSUMER_KEY:-}
  DISCOGS_CONSUMER_SECRET: ${DISCOGS_CONSUMER_SECRET:-}
  DISCOGS_USER_AGENT: ${DISCOGS_USER_AGENT:-GrooveTracker/0.1}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: groove_tracker
      POSTGRES_USER: groove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-groove}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groove -d groove_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: sh -c "npm run db:migrate && npm run api"
    environment: *app-environment
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      - api

  worker:
    build: .
    restart: unless-stopped
    command: sh -c "npm run db:migrate && while true; do npm run worker:sync; sleep 3600; done"
    environment: *app-environment
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  app-node-modules:
